map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}

map $host $admin_host {
    default 0;
    admin.vasatiproperties.com 1;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 50m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    keepalive_timeout 65s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    if ($host = www.vasatiproperties.com) {
        return 308 https://vasatiproperties.com$request_uri;
    }

    location = /healthz { access_log off; return 200 'ok'; }
    # Serve bundled assets without waking the application or opening SQLite.
    # HTML and protected files are deliberately excluded from this location.
    location ~ ^/(?:[a-zA-Z0-9_-]+\.(?:css|js)|images/[a-zA-Z0-9_.-]+\.(?:png|jpe?g|webp|svg|ico))$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        access_log off;
    }
    # Keep the existing admin hostname while proxying HTML through Express SEO.
    location = / {
        if ($admin_host = 1) {
            return 302 https://admin.vasatiproperties.com/admin;
        }
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin pages, APIs, protected brochures and uploaded images stay behind Express.
    location / {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
