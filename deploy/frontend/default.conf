map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { access_log off; return 200 'ok'; }
    location = / { try_files /index.html =404; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location /images/ { try_files $uri =404; }
    location = /logo.png { try_files $uri =404; }

    # Admin pages, APIs, protected brochures and uploaded images stay behind Express.
    location / {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
