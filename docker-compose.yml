services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@example.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set a unique ADMIN_DEFAULT_PASSWORD in Coolify}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set a random IP_HASH_SALT in Coolify}
      APP_BASE_URL: ${APP_BASE_URL:?Set the public HTTPS URL in Coolify}
      SITE_URL: ${SITE_URL:-${APP_BASE_URL}}
      SEO_INDEXABLE: ${SEO_INDEXABLE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
      MCP_WRITE_TOKEN: ${MCP_WRITE_TOKEN:-}
    volumes:
      - app_data:/app/data
      - uploads_data:/app/public/uploads
    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
  uploads_data:
