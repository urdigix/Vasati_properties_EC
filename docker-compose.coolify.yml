services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/storage/uploads
      APP_BASE_URL: ${APP_BASE_URL:?Set the public origin}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@example.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set a unique bootstrap password}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set a random analytics salt}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_SERVICE_ACCOUNT_EMAIL: ${GA4_SERVICE_ACCOUNT_EMAIL:-}
      GA4_SERVICE_ACCOUNT_PRIVATE_KEY: ${GA4_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
      MCP_WRITE_TOKEN: ${MCP_WRITE_TOKEN:-}
    volumes:
      - database_data:/app/data
      - uploaded_media:/app/storage/uploads
    security_opt:
      - no-new-privileges:true

volumes:
  database_data:
  uploaded_media:
