<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>Admin sign in — Vasati Properties</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090d16;color:#f3f4f6;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(420px,100%);padding:32px;background:#111827;border:1px solid #263244;border-radius:16px;box-shadow:0 20px 60px #0006}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}.brand strong{letter-spacing:1px}.brand span{display:block;color:#38bdf8;font-size:11px;letter-spacing:2px}.card h1{font-size:24px;margin:0 0 8px}.sub{color:#9ca3af;font-size:14px;margin:0 0 24px}label{display:block;font-weight:650;font-size:13px;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #374151;border-radius:8px;background:#0c1220;color:white;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:700 15px inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:12px;color:#fca5a5;font-size:13px}.notice{font-size:12px;color:#9ca3af;margin:16px 0 0;line-height:1.5}a{color:#93c5fd}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/images/logo.png" alt=""><div><strong>VASATI</strong><span>ADMIN PORTAL</span></div></div>
    <h1 id="heading">Admin sign in</h1>
    <p class="sub" id="subtitle">Sign in with your administrator account.</p>
    <form id="authForm">
      <label for="email" id="emailLabel">Email address</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password" id="passwordLabel">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="confirmGroup" hidden>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12">
      </div>
      <button id="submitButton" type="submit">Sign in</button>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </form>
    <p class="notice">Administrator access only. Use a unique password and do not share this account.</p>
  </main>
  <script>
    const form = document.getElementById('authForm');
    const errorEl = document.getElementById('error');
    const button = document.getElementById('submitButton');
    let changingPassword = false;

    async function checkSession() {
      try {
        const response = await fetch('/api/admin/session');
        const result = await response.json();
        if (result.authenticated) {
          if (result.mustChangePassword) showPasswordChange();
          else location.replace('/admin');
        }
      } catch {
        errorEl.textContent = 'Could not connect to the server.';
      }
    }

    function showPasswordChange() {
      changingPassword = true;
      document.getElementById('heading').textContent = 'Choose a new password';
      document.getElementById('subtitle').textContent = 'Your temporary password must be replaced before using the dashboard.';
      document.getElementById('emailLabel').hidden = true;
      document.getElementById('email').hidden = true;
      document.getElementById('passwordLabel').textContent = 'New password (at least 12 characters)';
      document.getElementById('password').value = '';
      document.getElementById('password').autocomplete = 'new-password';
      document.getElementById('password').minLength = 12;
      document.getElementById('confirmGroup').hidden = false;
      button.textContent = 'Save password';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      button.disabled = true;
      try {
        if (changingPassword && document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
          throw new Error('The passwords do not match.');
        }
        const response = await fetch(changingPassword ? '/api/admin/auth/change-password' : '/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Sign in failed.');
        if (changingPassword) location.replace('/admin');
        else if (result.mustChangePassword) showPasswordChange();
        else location.replace('/admin');
      } catch (error) {
        errorEl.textContent = error.message || 'Something went wrong.';
      } finally {
        button.disabled = false;
      }
    });

    checkSession();
  </script>
</body>
</html>
