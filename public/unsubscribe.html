<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribe — Vasati Properties</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0b192c;font:16px system-ui,sans-serif}.card{width:min(420px,100%);padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 32px #0f172a12}h1{font-size:24px}button{padding:11px 16px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-weight:700;cursor:pointer}.status{min-height:24px;color:#475569}</style>
</head>
<body>
  <main class="card">
    <h1>Unsubscribe from updates</h1>
    <p>Confirm to stop property update emails. This does not affect enquiries or brochure access.</p>
    <button id="unsubscribeButton" type="button">Unsubscribe</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <a href="/">Return to Vasati Properties</a>
  </main>
  <script>
    document.getElementById('unsubscribeButton').addEventListener('click', async event => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const response = await fetch('/api/subscribers/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: new URLSearchParams(location.search).get('token') || '' })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Could not unsubscribe.');
        document.getElementById('status').textContent = result.message;
      } catch (error) {
        document.getElementById('status').textContent = error.message || 'Could not unsubscribe.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
